name: Regiopagina’s bouwen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s regio
      - run: python3 regio/bouw.py "${{ runner.temp }}/site"
      - name: Voorbeeldsite bewaren
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: deba-voorbeeldsite
          path: ${{ runner.temp }}/site
          include-hidden-files: true
      - name: Pages-pakket maken
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
